name: Publish

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # This runs on every push to main, so skip an unchanged version instead of
      # failing the run on "cannot publish over the previously published version".
      - name: Check whether version is already published
        id: published
        run: |
          if npm view "@blindpay/mcp@${{ steps.version.outputs.value }}" version >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.published.outputs.value == 'false'
        run: npm ci

      - name: Typecheck
        if: steps.published.outputs.value == 'false'
        run: npm run typecheck

      - name: Build package
        if: steps.published.outputs.value == 'false'
        run: npm run build

      # SERVER_VERSION in src/index.ts must match package.json, since the MCP
      # reports it to clients on handshake.
      - name: Verify SERVER_VERSION matches package.json
        if: steps.published.outputs.value == 'false'
        run: |
          SERVER_VERSION=$(grep -oE "SERVER_VERSION = '[^']+'" src/index.ts | sed "s/.*'\(.*\)'/\1/")
          if [ "$SERVER_VERSION" != "${{ steps.version.outputs.value }}" ]; then
            echo "SERVER_VERSION ($SERVER_VERSION) != package.json (${{ steps.version.outputs.value }})"
            exit 1
          fi

      # Auth comes from npm trusted publishing (OIDC), enabled by id-token: write.
      # Do not add NODE_AUTH_TOKEN: it writes an _authToken into .npmrc, which
      # takes precedence over the OIDC exchange and fails with E404.
      - name: Publish package
        if: steps.published.outputs.value == 'false'
        run: npm publish

      - name: Tag and create release
        if: steps.published.outputs.value == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.value }}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes
