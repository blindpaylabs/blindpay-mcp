name: API Sync

on:
  repository_dispatch:
    types: [api-sync]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Regenerate MCP from API spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch filtered spec from api-sync-data
        run: |
          git fetch origin api-sync-data
          mkdir -p .api-sync
          git show origin/api-sync-data:.api-sync/openapi.json > .api-sync/openapi.json
          jq '.paths | length' .api-sync/openapi.json

      - name: Check for existing api-sync PR
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --head api-sync --json number --jq '.[0].number // empty')
          echo "existing_pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Create or reset api-sync branch from main
        run: |
          git fetch origin api-sync 2>/dev/null || true
          if git rev-parse --verify origin/api-sync >/dev/null 2>&1; then
            git checkout api-sync
            git reset --hard origin/main
          else
            git checkout -b api-sync
          fi

      - name: Install dependencies
        run: npm ci

      # Pure script, no LLM: rebuilds src/index.ts from src/index.template.ts
      # plus a freshly generated tool map, and bumps package.json's version
      # from a scripted diff of the tool-name set. Fails loudly (non-zero
      # exit) instead of guessing if the spec has something it can't map.
      - name: Deterministic sync
        run: |
          npm run sync | tee /tmp/sync-output.txt
          awk '/^\{$/{found=1} found' /tmp/sync-output.txt > /tmp/sync-summary.json
          cat /tmp/sync-summary.json

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tool name length gate
        run: npm run check-tool-names

      - name: Commit and push
        id: commit
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.SDK_SYNC_PAT }}@github.com/${{ github.repository }}.git"
          git add -A -- src/index.ts package.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: sync MCP with API changes (v$NEW_VERSION)"
          git push --force-with-lease origin api-sync

      - name: Create or update PR
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.SDK_SYNC_PAT }}
        run: |
          EXISTING_PR="${{ steps.check-pr.outputs.existing_pr }}"
          {
            echo "Automated, deterministic MCP sync from the latest API spec. No LLM involved:"
            echo '\`scripts/sync.mts\` rebuilt \`src/index.ts\` from \`src/index.template.ts\` plus a freshly generated tool map.'
            echo
            echo '\`\`\`json'
            cat /tmp/sync-summary.json
            echo '\`\`\`'
          } > /tmp/pr-body.md

          if [ -n "$EXISTING_PR" ]; then
            echo "Updating existing PR #$EXISTING_PR"
            gh pr comment "$EXISTING_PR" --body-file /tmp/pr-body.md
            PR_NUMBER="$EXISTING_PR"
          else
            gh pr create \
              --title "feat: sync MCP with API changes (v${{ steps.commit.outputs.new_version }})" \
              --body-file /tmp/pr-body.md \
              --base main \
              --head api-sync
            PR_NUMBER=$(gh pr list --head api-sync --json number --jq '.[0].number')
          fi

          gh pr merge "$PR_NUMBER" --auto --squash
